<!DOCTYPE html>
<html lang="en">
<head>
<title>MCA Past Adventures</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet data-dc-atomics>
<style>
  html{scroll-snap-type:y proximity;background:#f8f8f8}
  body{margin:0}
  ::selection{background:#2a2722;color:#ECE4D2}
</style>
</helmet>
<div class="stage" ref="{{ stageRef }}" style="position:relative;font-family:Georgia,'Times New Roman',serif;color:#2a2722;transition:color .35s ease">
  <div ref="{{ bgRef }}" style="position:fixed;inset:0;z-index:0;background:#f8f8f8;transition:background-color .25s linear"></div>
  <svg ref="{{ svgRef }}" viewBox="0 0 1000 9000" preserveAspectRatio="none" style="position:absolute;top:0;left:0;width:100%;height:900vh;z-index:1;pointer-events:none">
    <path ref="{{ pathRef }}" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" opacity="0.5" vector-effect="non-scaling-stroke"></path>
  </svg>

  <header style="position:fixed;top:0;left:0;right:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:22px 30px;font-family:Arial,Helvetica,sans-serif;font-size:11px;letter-spacing:.14em;text-transform:uppercase;mix-blend-mode:difference;color:#fff">
    <span>A Topographic Index</span>
    <span>West · 2026</span>
  </header>
  <div style="position:fixed;bottom:22px;right:30px;z-index:5;font-family:Arial,Helvetica,sans-serif;font-size:12px;letter-spacing:.1em;mix-blend-mode:difference;color:#fff"><span ref="{{ idxRef }}">01</span> / 09</div>
  <div ref="{{ hintRef }}" style="position:fixed;bottom:22px;left:30px;z-index:5;font-family:Arial,Helvetica,sans-serif;font-size:11px;letter-spacing:.14em;text-transform:uppercase;mix-blend-mode:difference;color:#fff;transition:opacity .4s">Scroll ↓</div>

  <sc-for list="{{ items }}" as="item" hint-placeholder-count="9">
    <section style="position:relative;z-index:2;height:100vh;scroll-snap-align:start;display:flex;align-items:center;justify-content:center;gap:clamp(32px,6vw,96px);padding:0 clamp(28px,7vw,120px);box-sizing:border-box;flex-wrap:wrap">
      <div class="flip" onMouseEnter="{{ item.onEnter }}" onMouseLeave="{{ onLeave }}" style="flex:none;height:68vh;aspect-ratio:2/3;position:relative;cursor:pointer">
        <div style="position:absolute;inset:0;background:#fdfdfb;box-shadow:0 24px 60px -28px rgba(0,0,0,.45);background-image:repeating-linear-gradient(45deg,transparent 0 13px,rgba(0,0,0,.045) 13px 14px);display:flex;flex-direction:column;justify-content:space-between;padding:18px;box-sizing:border-box;font-family:Arial,Helvetica,sans-serif;transition:opacity .55s ease;opacity:{{ item.frontOpacity }}">
          <span style="font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#2a2722">{{ item.title }}</span>
          <div style="align-self:center;text-align:center;color:#2a2722">
            <div style="font-size:13px;letter-spacing:.1em">WHITE · 4×6</div>
            <div style="font-size:10px;opacity:.5;margin-top:6px">drop front image</div>
          </div>
          <span style="font-size:10px;letter-spacing:.16em;color:#2a2722;opacity:.5">N°{{ item.num }}</span>
        </div>
        <div style="position:absolute;inset:0;background:#121210;box-shadow:0 24px 60px -28px rgba(0,0,0,.6);background-image:repeating-linear-gradient(45deg,transparent 0 13px,rgba(255,255,255,.06) 13px 14px);display:flex;flex-direction:column;justify-content:space-between;padding:18px;box-sizing:border-box;font-family:Arial,Helvetica,sans-serif;color:#efece2;transition:opacity .55s ease;opacity:{{ item.backOpacity }}">
          <span style="font-size:10px;letter-spacing:.16em;text-transform:uppercase">{{ item.title }}</span>
          <div style="align-self:center;text-align:center">
            <div style="font-size:13px;letter-spacing:.1em">BLACK · 4×6</div>
            <div style="font-size:10px;opacity:.5;margin-top:6px">drop back image</div>
          </div>
          <span style="font-size:10px;letter-spacing:.16em;opacity:.5">N°{{ item.num }}</span>
        </div>
      </div>

      <div style="flex:1 1 300px;max-width:440px;min-width:260px">
        <div style="font-family:Arial,Helvetica,sans-serif;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:inherit;opacity:.6">N°{{ item.num }} / 09</div>
        <h2 style="font-size:clamp(38px,5.4vw,76px);line-height:.98;font-weight:600;margin:14px 0 0;letter-spacing:-.02em;text-wrap:balance;color:inherit">{{ item.title }}</h2>
        <div style="width:56px;height:2px;background:currentColor;margin:26px 0;opacity:.7"></div>
        <p style="font-family:Arial,Helvetica,sans-serif;font-size:13px;line-height:1.7;color:inherit;opacity:.75;margin:0;max-width:320px">{{ item.desc }}</p>
        <div style="font-family:Arial,Helvetica,sans-serif;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:inherit;opacity:.45;margin-top:30px">↺ Hover to flip</div>
      </div>
    </section>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { hovered: null };
  bgRef = React.createRef();
  svgRef = React.createRef();
  pathRef = React.createRef();
  idxRef = React.createRef();
  hintRef = React.createRef();
  stageRef = React.createRef();

  titles = ["Mount Baldy","Grand Canyon","Mount Shasta","Mount Humphreys","Mount Whitney","Half Dome","Mount Langley","Ellingwood Peak","Blanca Peak"];
  colors = ["#f8f8f8","#3FB8AD","#E8558C","#2E5D3B","#7A5236","#2E2E2E","#C63A2E","#3FB8AD","#f8f8f8"];

  buildD(){
    const S=9,H=1000,W0=170,W1=830,span=W1-W0,base=680;
    const P=[
      [[0,0],[.12,120],[.26,210],[.4,255],[.5,262],[.6,255],[.74,210],[.88,120],[1,0]],
      [[0,0],[.1,90],[.2,40],[.34,-120],[.44,-230],[.5,-268],[.56,-230],[.66,-120],[.8,40],[.9,90],[1,0]],
      [[0,0],[.22,150],[.36,300],[.47,370],[.5,384],[.53,370],[.64,300],[.78,150],[1,0]],
      [[0,0],[.16,220],[.28,140],[.4,320],[.52,190],[.62,350],[.72,180],[.84,240],[1,0]],
      [[0,0],[.2,150],[.3,110],[.42,250],[.52,420],[.62,240],[.76,130],[1,0]],
      [[0,0],[.14,170],[.28,290],[.42,350],[.5,360],[.5,0],[1,0]],
      [[0,0],[.18,130],[.32,300],[.4,330],[.6,330],[.68,300],[.82,130],[1,0]],
      [[0,0],[.16,170],[.28,120],[.4,360],[.5,150],[.6,384],[.72,120],[.86,180],[1,0]],
      [[0,0],[.14,180],[.27,300],[.4,255],[.52,360],[.64,255],[.78,300],[.9,170],[1,0]]
    ];
    let cur=500;
    let d="M 500 0";
    for(let i=0;i<S;i++){
      const top=i*H, l2r=i%2===0;
      const startX=l2r?W0:W1, endX=l2r?W1:W0, baseY=top+base, bottom=top+H;
      d+=` C ${cur} ${top+240} ${startX} ${baseY-320} ${startX} ${baseY}`;
      const pts=P[i];
      for(let k=1;k<pts.length;k++){
        const t=pts[k][0], h=pts[k][1];
        const x = l2r ? W0+t*span : W1 - t*span;
        const y = baseY - h;
        d+=` L ${x.toFixed(1)} ${y.toFixed(1)}`;
      }
      d+=` C ${endX} ${baseY+320} ${endX} ${bottom-240} ${endX} ${bottom}`;
      cur=endX;
    }
    return d;
  }

  hex(h){ return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]; }
  blend(a,b,f){ const A=this.hex(a),B=this.hex(b); return A.map((v,i)=>Math.round(v+(B[i]-v)*f)); }

  componentDidMount(){
    const p=this.pathRef.current;
    if(p){
      p.setAttribute("d", this.buildD());
      this.len = p.getTotalLength();
      p.style.strokeDasharray = this.len;
      p.style.strokeDashoffset = this.len;
    }
    this.onScroll = ()=>{ if(this._raf) return; this._raf=requestAnimationFrame(()=>{ this._raf=0; this.update(); }); };
    window.addEventListener("scroll", this.onScroll, {passive:true});
    window.addEventListener("resize", this.onScroll, {passive:true});
    this.update();
  }
  componentWillUnmount(){ window.removeEventListener("scroll", this.onScroll); window.removeEventListener("resize", this.onScroll); }

  update(){
    const vh=window.innerHeight;
    const max=Math.max(1, document.documentElement.scrollHeight - vh);
    const y=window.scrollY;
    const prog=Math.min(1, Math.max(0, y/max));
    if(this.pathRef.current && this.len) this.pathRef.current.style.strokeDashoffset = this.len*(1-prog);
    const pos=Math.min(8, y/vh);
    const i=Math.floor(pos), f=pos-i;
    const rgb=this.blend(this.colors[i], this.colors[Math.min(8,i+1)], f);
    if(this.bgRef.current) this.bgRef.current.style.backgroundColor=`rgb(${rgb.join(",")})`;
    const lum=(0.299*rgb[0]+0.587*rgb[1]+0.114*rgb[2])/255;
    if(this.stageRef.current) this.stageRef.current.style.color = lum<0.55 ? "#faf5ea" : "#2a2722";
    if(this.idxRef.current) this.idxRef.current.textContent = String(Math.round(pos)+1).padStart(2,"0");
    if(this.hintRef.current) this.hintRef.current.style.opacity = y>vh*0.35 ? "0" : "1";
  }

  renderVals(){
    const items = this.titles.map((t,i)=>({
      title:t,
      num:String(i+1).padStart(2,"0"),
      desc:"Short filler description sits here for now.",
      frontOpacity: this.state.hovered===i ? 0 : 1,
      backOpacity: this.state.hovered===i ? 1 : 0,
      onEnter: ()=>this.setState({hovered:i})
    }));
    return {
      items,
      onLeave: ()=>this.setState({hovered:null}),
      bgRef:this.bgRef, svgRef:this.svgRef, pathRef:this.pathRef,
      idxRef:this.idxRef, hintRef:this.hintRef, stageRef:this.stageRef
    };
  }
}
</script>
</body>
</html>
