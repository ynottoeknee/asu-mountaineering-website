name: Steepen home events
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/steepen-home-events.yml'
permissions:
  contents: write
jobs:
  update_site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Append steeper event layout
        shell: bash
        run: |
          printf '%s' '' | base64 -d >> css/styles-20260829-6.css
          rm .github/workflows/steepen-home-events.yml
          git config user.name 'MCA Website Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Steepen home event staircase'
          git push origin HEAD:main
