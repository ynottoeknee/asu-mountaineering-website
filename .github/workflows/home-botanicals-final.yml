name: Finalize home botanicals
on:
  push:
    branches: [main]
    paths: ['.github/workflows/home-botanicals-final.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Add home botanical styling
        run: |
          printf '%s' '' | base64 -d >> css/styles-20260829-6.css
          rm -f .github/workflows/home-botanicals-final.yml .github/workflows/apply-home-botanical-art.yml
          git config user.name 'MCA Website Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Add blue botanical art to home sections'
          git push origin HEAD:main
