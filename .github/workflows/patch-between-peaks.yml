name: Patch Between Peaks source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-between-peaks.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch Between Peaks directly in index.html
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          start = text.index('<section id="between" class="page">')
          end = text.index('<section id="resources" class="page">', start)
          section = text[start:end]

          hero = '<section class="page-hero compact wire-box"><div class="eyebrow">Between Peaks</div><h1>Pictures, poems, and a game of Hearts.</h1></section>'
          if hero not in section:
              raise SystemExit('Expected Between Peaks hero not found')
          section = section.replace(hero, '', 1)

          top_photos = [
              ('belay-dog.webp', 'Climber belaying beside a dog at a rocky crag'),
              ('sunset-group.webp', 'MCA members gathered on a rocky overlook at sunset'),
              ('forest-pack.webp', 'Backpackers hiking through a forest'),
          ]
          placeholder = '<div class="photo-placeholder dash-box">Photo space</div>'
          for filename, alt in top_photos:
              replacement = f'<img class="between-photo-real" src="assets/images/between-peaks/{filename}?v=20260829-7" alt="{alt}" loading="eager" decoding="async">'
              if placeholder not in section:
                  raise SystemExit(f'Expected top photo placeholder missing before {filename}')
              section = section.replace(placeholder, replacement, 1)

          member_placeholder = '<div class="photo-placeholder dash-box">Member photo</div>'
          member_img = '<img class="between-photo-real" src="assets/images/between-peaks/snow-camp.webp?v=20260829-7" alt="Tent and climbing gear in snowy mountain conditions" loading="eager" decoding="async">'
          if member_placeholder not in section:
              raise SystemExit('Expected member photo placeholder not found')
          section = section.replace(member_placeholder, member_img, 1)

          trip_placeholder = '<div class="photo-placeholder dash-box">Trip photo</div>'
          trip_img = '<img class="between-photo-real" src="assets/images/between-peaks/belay-dog.webp?v=20260829-7" alt="Climber belaying beside a dog at a rocky crag" loading="eager" decoding="async">'
          if trip_placeholder not in section:
              raise SystemExit('Expected trip photo placeholder not found')
          section = section.replace(trip_placeholder, trip_img, 1)

          text = text[:start] + section + text[end:]
          text = text.replace('href="css/styles-20260829-6.css"', 'href="css/styles-20260829-6.css?v=20260829-7"', 1)
          text = text.replace('src="js/site.js?v=20260825-1"', 'src="js/site.js?v=20260829-7"', 1)
          text = text.replace('src="js/calendar-events-20260801.js?v=20260825-1"', 'src="js/calendar-events-20260801.js?v=20260829-7"', 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit direct source fix
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "No changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Hardcode Between Peaks photos and remove banner"
          git push origin HEAD:main
