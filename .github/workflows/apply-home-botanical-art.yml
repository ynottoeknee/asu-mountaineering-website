name: Apply home botanical line art
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-home-botanical-art.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply botanical home styling
        run: |
          cat >> css/styles-20260829-6.css <<'EOF'

/* Home botanical art — blue ink on warm paper */
#home .home-events-section{
  background:#fbf8f1 !important;
  border-color:#d9d2c6 !important;
  isolation:isolate;
}
#home .home-events-section::before{
  content:"";
  position:absolute;
  inset:0;
  z-index:0;
  pointer-events:none;
  background:url('../assets/images/decor/home-lavender-line.svg') center / 100% 100% no-repeat !important;
  opacity:.52 !important;
  filter:none !important;
}
#home .home-events-section::after{
  content:"";
  position:absolute;
  inset:0;
  z-index:0;
  pointer-events:none;
  background:linear-gradient(90deg,rgba(251,248,241,.18),rgba(251,248,241,.02) 22%,rgba(251,248,241,.02) 78%,rgba(251,248,241,.18)) !important;
}
#home .home-events-section > *{
  position:relative;
  z-index:1;
}

#home .home-jane-quote{
  background-color:#f7f3ea !important;
  background-image:url('../assets/images/decor/home-prickly-pear-line.svg') !important;
  background-repeat:no-repeat !important;
  background-position:center bottom -26px !important;
  background-size:108% auto !important;
  border-color:#d8d0c4 !important;
  color:#17233b !important;
  min-height:340px;
  padding-bottom:138px;
}
#home .home-jane-quote .home-quote-copy{
  position:relative;
  z-index:1;
  text-shadow:none !important;
  color:#17233b !important;
}
#home .home-jane-quote small{
  color:#173d8f !important;
}

#home .home-challenge-section{
  background-color:#fbf8f1 !important;
  background-image:url('../assets/images/decor/home-prickly-pear-line.svg') !important;
  background-repeat:no-repeat !important;
  background-position:center bottom -62px !important;
  background-size:118% auto !important;
  border-color:#d8d0c4 !important;
  min-height:300px;
  padding-bottom:128px;
}
#home .home-challenge-section .challenge-cta{
  position:relative;
  z-index:1;
}
#home .home-challenge-section h2{
  color:#173d8f !important;
}
#home .home-challenge-section p{
  color:#292821 !important;
}

@media(max-width:720px){
  #home .home-events-section::before{
    background-size:auto 100% !important;
    background-position:center !important;
    opacity:.38 !important;
  }
  #home .home-jane-quote{
    min-height:300px;
    padding-bottom:112px;
    background-size:auto 48% !important;
    background-position:center bottom !important;
  }
  #home .home-challenge-section{
    min-height:280px;
    padding-bottom:116px;
    background-size:auto 52% !important;
    background-position:center bottom !important;
  }
}
EOF
          rm .github/workflows/apply-home-botanical-art.yml
          git config user.name 'MCA Website Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Add blue botanical art to home sections'
          git push origin HEAD:main
