name: Fix Between Peaks drawing
on:
  push:
    branches: [fix-between-peaks-images]
    paths: ['.github/workflows/fix-between-peaks-drawing.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-between-peaks-images
          fetch-depth: 0
      - name: Show full line drawing
        run: echo '' | base64 -d >> css/styles-20260829-6.css
      - name: Commit repair
        run: |
          rm .github/workflows/fix-between-peaks-drawing.yml
          git config user.name 'MCA Website Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Show full Between Peaks line drawing'
          git push origin HEAD:fix-between-peaks-images
