name: Fix Between Peaks drawing
on:
  push:
    branches: [fix-between-peaks-images]
    paths: ['.github/workflows/fix-between-peaks-drawing.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-between-peaks-images
          fetch-depth: 0
      - name: Show full line drawing
        run: |
          cat >> css/styles-20260829-6.css <<'EOF'

/* Between Peaks image repair — full artwork, no crop */
#between .side-rail:first-of-type > .between-drawing-slot{
  width:31% !important;
  height:auto !important;
  aspect-ratio:1 / 1 !important;
  padding:8px !important;
}
#between .between-drawing-slot img{
  display:block !important;
  width:100% !important;
  height:auto !important;
  max-height:none !important;
  aspect-ratio:auto !important;
  object-fit:contain !important;
  object-position:center !important;
}
@media(max-width:900px){
  #between .side-rail:first-of-type > .between-drawing-slot{
    width:100% !important;
    height:auto !important;
    aspect-ratio:1 / 1 !important;
  }
}
@media(max-width:640px){
  #between .side-rail:first-of-type > .between-drawing-slot{
    width:100% !important;
    height:auto !important;
    aspect-ratio:1 / 1 !important;
  }
}
EOF
      - name: Commit repair
        run: |
          rm .github/workflows/fix-between-peaks-drawing.yml
          git config user.name 'MCA Website Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Show full Between Peaks line drawing'
          git push origin HEAD:fix-between-peaks-images
