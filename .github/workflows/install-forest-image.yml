name: Install exact forest image
on:
  push:
    branches: [fix-between-peaks-images]
    paths: ['.github/workflows/install-forest-image.yml']
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-between-peaks-images
          fetch-depth: 0
      - name: Decode forest image
        run: |
          cat .github/tmp/forest-00.b64 .github/tmp/forest-01.b64 .github/tmp/forest-02.b64 .github/tmp/forest-03.b64 .github/tmp/forest-04.b64 .github/tmp/forest-05.b64 | base64 -d > assets/images/between-peaks/forest-pack.webp
          test "$(head -c 4 assets/images/between-peaks/forest-pack.webp)" = "RIFF"
          test "$(stat -c%s assets/images/between-peaks/forest-pack.webp)" -eq 21756
      - name: Commit exact forest photo
        run: |
          rm -rf .github/tmp .github/workflows/install-forest-image.yml
          git config user.name 'MCA Website Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Restore exact Between Peaks forest photo'
          git push origin HEAD:fix-between-peaks-images
